<!DOCTYPE html>
<html>
<head>
    <title>Hospital Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e7f9fb;
            text-align: center;
            padding-top: 80px;
        }

        .login-box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px 25px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #05636d;
        }

        #logoutSection {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🏥 HospitalCare</h1>
        <h2>Login</h2>

        <div id="loginSection">

            <label>Username:</label><br>

            <input type="text"
                   id="username"
                   placeholder="Enter username">

            <br>

            <label>Password:</label><br>

            <input type="password"
                   id="password"
                   placeholder="Enter password">

            <br><br>

            <button onclick="loginUser()">
                🔐 Login
            </button>

        </div>


        <div id="logoutSection">

            <h3>✅ You are logged in!</h3>

            <button onclick="logoutUser()">
                🚪 Logout
            </button>

        </div>

    </div>


    <script>

        /* ================= LOGIN ================= */

        function loginUser() {

            let username =
                document.getElementById("username").value.trim();

            let password =
                document.getElementById("password").value;

            if (username === "admin" && password === "1234") {

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );

                alert("✅ Login Successful!");

                showLogout();

            } else {

                alert("❌ Invalid Username or Password!");

            }
        }


        /* ================= SHOW LOGOUT ================= */

        function showLogout() {

            document.getElementById("loginSection")
                .style.display = "none";

            document.getElementById("logoutSection")
                .style.display = "block";
        }


        /* ================= LOGOUT ================= */

        function logoutUser() {

            localStorage.removeItem("isLoggedIn");

            alert("✅ Logged out successfully!");

            document.getElementById("logoutSection")
                .style.display = "none";

            document.getElementById("loginSection")
                .style.display = "block";

            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }


        /* ================= CHECK LOGIN ================= */

        window.onload = function () {

            if (localStorage.getItem("isLoggedIn") === "true") {
                showLogout();
            }

        };

    </script>

</body>
</html>
